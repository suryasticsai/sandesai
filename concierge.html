<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ask RAGina</title>
    <link rel="icon" href="sandesai-logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #07050e;
            color: #eef0f5;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 20% 10%, rgba(139,92,246,0.18), transparent 55%),
                radial-gradient(circle at 80% 90%, rgba(110,231,255,0.12), transparent 55%),
                #07050e;
        }
        .header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.25);
            flex-shrink: 0;
        }
        .header img {
            width: 40px; height: 40px; border-radius: 10px;
            object-fit: cover; background: rgba(139,92,246,0.15);
        }
        .header-info { flex: 1; min-width: 0; }
        .header-title { font-weight: 700; font-size: 1rem; }
        .header-sub { font-size: 0.75rem; color: #7a89a8; margin-top: 1px; }
        .header .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2fd992; box-shadow: 0 0 8px #2fd992;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg.bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 4px;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg,#7c3aed,#6d28d9);
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .msg.typing {
            display: flex;
            gap: 4px;
            padding: 14px 18px;
        }
        .msg.typing span {
            width: 6px; height: 6px; border-radius: 50%;
            background: #a78bfa;
            animation: bounce 1.2s infinite;
        }
        .msg.typing span:nth-child(2) { animation-delay: 0.15s; }
        .msg.typing span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .suggestions {
            padding: 0 16px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .suggestions::-webkit-scrollbar { display: none; }
        .chip {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(139,92,246,0.25);
            background: rgba(139,92,246,0.08);
            color: #c4b5fd;
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }
        .chip:active { transform: scale(0.96); }
        .input-bar {
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.25);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #eef0f5;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }
        .input-bar input:focus { border-color: rgba(139,92,246,0.5); }
        .send-btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg,#7c3aed,#6d28d9);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(139,92,246,0.4);
        }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.4; }
        .email-modal {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(8,6,20,0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .email-modal.open { opacity: 1; pointer-events: auto; }
        .email-card {
            max-width: 340px; width: 100%;
            background: rgba(18,16,36,0.96);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 22px;
            padding: 28px 24px 22px;
            text-align: center;
        }
        .email-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .email-card p { font-size: 0.82rem; color: #a5b3d0; line-height: 1.5; margin-bottom: 18px; }
        .email-card input {
            width: 100%; padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #eef0f5;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
        }
        .email-card input:focus { border-color: rgba(139,92,246,0.5); }
        .email-card button {
            width: 100%; padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg,#7c3aed,#6d28d9);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }
        .email-card .skip {
            background: none;
            color: #7a89a8;
            font-weight: 500;
            margin-top: 8px;
            padding: 8px;
            font-size: 0.82rem;
        }
        .loader-screen {
            position: fixed; inset: 0; z-index: 200;
            background: #07050e;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            color: #a78bfa;
            font-family: 'Inter', sans-serif;
        }
        .loader-screen i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loader-screen" id="loaderScreen">
    <i class="fas fa-circle-notch"></i>
    <div>Loading…</div>
</div>

<div class="header">
    <img id="bizLogo" src="sandesai-logo.png" alt="" />
    <div class="header-info">
        <div class="header-title" id="bizName">Loading…</div>
        <div class="header-sub" id="bizTagline">AI Assistant</div>
    </div>
    <div class="status-dot"></div>
</div>

<div class="messages" id="messages"></div>

<div class="suggestions" id="suggestions"></div>

<div class="input-bar">
    <input id="input" type="text" placeholder="Ask me anything…" autocomplete="off" />
    <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
</div>

<div class="email-modal" id="emailModal">
    <div class="email-card">
        <div style="font-size:2rem; margin-bottom:6px;">✉️</div>
        <h3>Stay in touch</h3>
        <p>Drop your email so we can follow up if we can't answer something here.</p>
        <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" />
        <button id="emailSave">Continue</button>
        <button class="skip" id="emailSkip">Skip for now</button>
    </div>
</div>

<!-- ⚙️ CONFIG — must be first -->
<script src="config.js"></script>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG — from config.js with fallbacks
// ════════════════════════════════════════════════════════════════
const CFG = window.SANDESAI || {};
const SHEET_API_URL = CFG.SHEET_API_URL ||
    'https://script.google.com/macros/s/AKfycbwgv2ko4WgWQOJzKh3h0VdXZsETaZIHF7cM0Dxv5PM/exec';
const SHEET_SECRET = CFG.SHEET_WEBHOOK_SECRET || 'sandesai-webhook-2026';
const RAGINA_ASK = CFG.RAGINA_ASK_URL || 'https://ragina-crawler-ragina.vercel.app/api/ask';

// ════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════
let business = {};
let knowledge = [];
let sessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
let email = localStorage.getItem('conciergeEmail') || '';
let history = [];
let busy = false;

// ════════════════════════════════════════════════════════════════
// Boot
// ════════════════════════════════════════════════════════════════
(async function boot() {
    try {
        const [bizResp, kbResp] = await Promise.all([
            fetch(SHEET_API_URL + '?type=business').then(r => r.json()),
            fetch(SHEET_API_URL + '?type=knowledge').then(r => r.json())
        ]);
        business = bizResp.business || {};
        knowledge = kbResp.knowledge || [];
    } catch (e) {
        console.warn('Failed to load business config:', e);
    }

    // Apply branding
    if (business.name) {
        document.title = 'Ask ' + business.name;
        document.getElementById('bizName').textContent = business.name;
    } else {
        document.getElementById('bizName').textContent = 'Sandesai';
    }
    if (business.tagline) document.getElementById('bizTagline').textContent = business.tagline;
    if (business.logo_url) document.getElementById('bizLogo').src = business.logo_url;

    // Hide loader
    document.getElementById('loaderScreen').style.display = 'none';

    // Welcome bubble
    addBot(business.welcome ||
        "Hi! I'm RAGina, your AI assistant. Ask me anything and I'll do my best to help.");

    // Suggestion chips
    renderSuggestions();

    // Ask for email after 6s (once per device)
    if (!email) {
        setTimeout(() => document.getElementById('emailModal').classList.add('open'), 6000);
    }

    document.getElementById('input').focus();
})();

// ════════════════════════════════════════════════════════════════
// UI helpers
// ════════════════════════════════════════════════════════════════
function addUser(text) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    document.getElementById('messages').appendChild(el);
    scrollBottom();
}

function addBot(text) {
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.textContent = text;
    document.getElementById('messages').appendChild(el);
    scrollBottom();
    return el;
}

function addTyping() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<span></span><span></span><span></span>';
    document.getElementById('messages').appendChild(el);
    scrollBottom();
    return el;
}

function scrollBottom() {
    const m = document.getElementById('messages');
    requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}

function renderSuggestions() {
    const box = document.getElementById('suggestions');
    box.innerHTML = '';
    const picks = knowledge.slice(0, 5).map(k => k.question);
    picks.forEach(q => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = q.length > 40 ? q.slice(0, 38) + '…' : q;
        chip.addEventListener('click', () => {
            document.getElementById('input').value = q;
            send();
        });
        box.appendChild(chip);
    });
    if (!picks.length) box.style.display = 'none';
}

// ════════════════════════════════════════════════════════════════
// Retrieval
// ════════════════════════════════════════════════════════════════
function tokenize(s) {
    return String(s || '')
        .toLowerCase()
        .replace(/[^\w\s]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length > 2);
}

function retrieveRelevant(query, topN) {
    topN = topN || 5;
    if (!knowledge.length) return [];
    const qTokens = tokenize(query);

    const scored = knowledge.map(item => {
        const hay = (item.question + ' ' + item.answer + ' ' + item.category).toLowerCase();
        const hTokens = tokenize(hay);
        let score = 0;
        qTokens.forEach(t => { if (hTokens.indexOf(t) >= 0) score += 1; });

        const qqTokens = tokenize(item.question);
        qTokens.forEach(t => { if (qqTokens.indexOf(t) >= 0) score += 1.5; });

        return { item: item, score: score };
    });

    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, topN).map(s => s.item);
}

// ════════════════════════════════════════════════════════════════
// Send message
// ════════════════════════════════════════════════════════════════
async function send() {
    if (busy) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    addUser(text);
    history.push({ role: 'user', text: text });
    busy = true;
    document.getElementById('sendBtn').disabled = true;

    const typing = addTyping();

    const relevant = retrieveRelevant(text, 5);
    const prompt = buildPrompt(relevant, text);
    let answer = '';

    try {
        const resp = await fetch(RAGINA_ASK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: prompt })
        });
        const data = await resp.json();
        answer = (data.text || '').trim() || "I'm sorry, I couldn't find that.";
    } catch (e) {
        answer = "I'm having trouble reaching my knowledge right now. Please try again in a moment.";
    }

    typing.remove();
    addBot(answer);
    history.push({ role: 'bot', text: answer });

    busy = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('input').focus();

    logConversation(text, answer);
}

function buildPrompt(relevant, query) {
    const bizLine = business.name
        ? 'You are the receptionist AI for "' + business.name + '". ' +
          'About: ' + (business.tagline || '') + '. ' +
          'Hours: ' + (business.hours || '') + '. ' +
          'Contact: ' + (business.contact_email || '') + '.'
        : 'You are a helpful AI assistant.';

    const kbBlock = relevant.length
        ? 'Use these approved answers when relevant:\n\n' +
          relevant.map(k => 'Q: ' + k.question + '\nA: ' + k.answer).join('\n\n')
        : '';

    return bizLine + '\n\n' + kbBlock + '\n\n' +
        'Visitor asked: "' + query + '"\n\n' +
        'Rules:\n' +
        '- Be warm, concise, and helpful. 2-4 sentences max unless asked for details.\n' +
        '- If the answer is in the approved list above, use it.\n' +
        '- If the answer is not in the list, still try to be helpful, but if you ' +
        "don't know, say you'll have the team follow up" +
        (email ? ' (their email is ' + email + ')' : '') + '.\n' +
        '- Never invent specific numbers (fees, dates, phone numbers) that aren\'t ' +
        'in the approved list.\n' +
        '- Never mention that you were given a list — just answer naturally.\n\n' +
        "Reply with ONLY the assistant's response.";
}

// ════════════════════════════════════════════════════════════════
// Logging
// ════════════════════════════════════════════════════════════════
async function logConversation(query, answer) {
    try {
        await fetch(SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                type: 'conversation',
                secret: SHEET_SECRET,
                sessionId: sessionId,
                email: email,
                query: query,
                answer: answer,
                source: 'concierge'
            })
        });
    } catch (e) {
        console.warn('Log failed:', e);
    }
}

// ════════════════════════════════════════════════════════════════
// Email capture
// ════════════════════════════════════════════════════════════════
document.getElementById('emailSave').addEventListener('click', () => {
    const v = document.getElementById('emailInput').value.trim();
    if (!v || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
        document.getElementById('emailInput').focus();
        return;
    }
    email = v;
    localStorage.setItem('conciergeEmail', email);
    document.getElementById('emailModal').classList.remove('open');
});

document.getElementById('emailSkip').addEventListener('click', () => {
    document.getElementById('emailModal').classList.remove('open');
});

// ════════════════════════════════════════════════════════════════
// Input events
// ════════════════════════════════════════════════════════════════
document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') send();
});
</script>

</body>
</html>
